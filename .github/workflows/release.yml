name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-Installed Android SDK (Platform 35)
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Align Gradle Catalog for Public GitHub Runner
        run: |
          python3 - << 'EOF'
          import re

          # 1. Patch gradle/libs.versions.toml to public Google Maven / Maven Central versions
          with open("gradle/libs.versions.toml", "r", encoding="utf-8") as f:
              toml = f.read()
          replacements = {
              'agp = "9.1.1"': 'agp = "8.7.3"',
              'coreKtx = "1.18.0"': 'coreKtx = "1.15.0"',
              'activityCompose = "1.10.1"': 'activityCompose = "1.9.3"',
              'kotlin = "2.2.10"': 'kotlin = "2.1.0"',
              'googleDevtoolsKsp = "2.3.5"': 'googleDevtoolsKsp = "2.1.0-1.0.29"',
              'googleServices = "4.5.0"': 'googleServices = "4.4.2"',
              'robolectric = "4.16.1"': 'robolectric = "4.14.1"',
              'firebaseBom = "34.17.0"': 'firebaseBom = "33.7.0"',
              'retrofit = "2.12.0"': 'retrofit = "2.11.0"',
              'converterMoshi = "2.12.0"': 'converterMoshi = "2.11.0"',
              'espressoCore = "3.7.0"': 'espressoCore = "3.6.1"',
              'junitVersion = "1.3.0"': 'junitVersion = "1.2.1"',
              'roomRuntime = "2.7.0"': 'roomRuntime = "2.6.1"',
              'roomKtx = "2.7.0"': 'roomKtx = "2.6.1"',
              'roomCompiler = "2.7.0"': 'roomCompiler = "2.6.1"',
              'workRuntimeKtx = "2.10.0"': 'workRuntimeKtx = "2.9.1"',
              'kotlinxCoroutinesAndroid = "1.10.2"': 'kotlinxCoroutinesAndroid = "1.9.0"',
              'kotlinxCoroutinesCore = "1.10.2"': 'kotlinxCoroutinesCore = "1.9.0"',
              'kotlinxCoroutinesTest = "1.10.2"': 'kotlinxCoroutinesTest = "1.9.0"',
          }
          for old, new in replacements.items():
              toml = toml.replace(old, new)
          if "kotlin-android =" not in toml:
              toml = toml.replace(
                  "[plugins]",
                  '[plugins]\nkotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }'
              )
          with open("gradle/libs.versions.toml", "w", encoding="utf-8") as f:
              f.write(toml)

          # 2. Patch root build.gradle.kts for AGP 8.7.3 (requires explicit kotlin-android plugin)
          with open("build.gradle.kts", "r", encoding="utf-8") as f:
              root_kts = f.read()
          root_kts = root_kts.replace(
              "alias(libs.plugins.android.application) apply false",
              "alias(libs.plugins.android.application) apply false\n  alias(libs.plugins.kotlin.android) apply false"
          ).replace(
              "alias(libs.plugins.google.services) apply false",
              "// alias(libs.plugins.google.services) apply false"
          ).replace(
              "alias(libs.plugins.secrets) apply false",
              "// alias(libs.plugins.secrets) apply false"
          )
          with open("build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(root_kts)

          # 3. Patch app/build.gradle.kts for AGP 8.7.3 + SDK 35
          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_kts = f.read()
          gradle_kts = gradle_kts.replace(
              "import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy\n",
              ""
          ).replace(
              "alias(libs.plugins.android.application)",
              "alias(libs.plugins.android.application)\n  alias(libs.plugins.kotlin.android)"
          ).replace(
              "alias(libs.plugins.google.services)",
              "// alias(libs.plugins.google.services)"
          ).replace(
              "alias(libs.plugins.secrets)",
              "// alias(libs.plugins.secrets)"
          ).replace(
              "googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN }",
              "// googleServices not required"
          )
          gradle_kts = re.sub(
              r"secrets\s*\{[^}]*\}",
              "// secrets plugin not required",
              gradle_kts
          )
          gradle_kts = re.sub(
              r"compileSdk\s*\{[^}]*\{[^}]*\}[^}]*\}",
              "compileSdk = 35",
              gradle_kts
          )
          gradle_kts = gradle_kts.replace("targetSdk = 36", "targetSdk = 35")
          gradle_kts = gradle_kts.replace(
              "targetCompatibility = JavaVersion.VERSION_11\n  }",
              'targetCompatibility = JavaVersion.VERSION_11\n  }\n  kotlinOptions {\n    jvmTarget = "11"\n  }'
          )
          with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(gradle_kts)

          # 4. Patch settings.gradle.kts foojay version & gradle.properties for CI
          with open("settings.gradle.kts", "r", encoding="utf-8") as f:
              settings_kts = f.read()
          settings_kts = settings_kts.replace('version "1.0.0"', 'version "0.8.0"')
          with open("settings.gradle.kts", "w", encoding="utf-8") as f:
              f.write(settings_kts)

          with open("gradle.properties", "r", encoding="utf-8") as f:
              gprops = f.read()
          gprops = gprops.replace("org.gradle.configuration-cache=true", "org.gradle.configuration-cache=false")
          if "android.useAndroidX=true" not in gprops:
              gprops += "\nandroid.useAndroidX=true\n"
          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write(gprops)

          with open("gradle/wrapper/gradle-wrapper.properties", "r", encoding="utf-8") as f:
              gw = f.read()
          gw = gw.replace("gradle-9.3.1-bin.zip", "gradle-8.11.1-bin.zip")
          with open("gradle/wrapper/gradle-wrapper.properties", "w", encoding="utf-8") as f:
              f.write(gw)

          # 5. Patch AppDatabase.kt for Room 2.6.1 compatibility on CI
          with open("app/src/main/java/com/example/data/AppDatabase.kt", "r", encoding="utf-8") as f:
              db_kt = f.read()
          db_kt = db_kt.replace(
              ".fallbackToDestructiveMigration(true)",
              ".fallbackToDestructiveMigration()"
          ).replace(
              ".fallbackToDestructiveMigrationOnDowngrade(true)",
              ".fallbackToDestructiveMigrationOnDowngrade()"
          )
          with open("app/src/main/java/com/example/data/AppDatabase.kt", "w", encoding="utf-8") as f:
              f.write(db_kt)

          # 6. Patch ExampleRobolectricTest.kt SDK level for CI
          with open("app/src/test/java/com/example/ExampleRobolectricTest.kt", "r", encoding="utf-8") as f:
              robo_kt = f.read()
          robo_kt = robo_kt.replace("@Config(sdk = [36])", "@Config(sdk = [34])")
          with open("app/src/test/java/com/example/ExampleRobolectricTest.kt", "w", encoding="utf-8") as f:
              f.write(robo_kt)
          EOF

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Signing Keystore (Debug & Release)
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$KEYSTORE_BASE64_SECRET" ]; then
            echo "$KEYSTORE_BASE64_SECRET" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PASS_SECRET}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS_SECRET}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass asisrelease123 \
              -keypass asisrelease123 \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ASiS Panel,OU=Gateway,O=ASiS,L=Tehran,S=Tehran,C=IR"
            echo "STORE_PASSWORD=asisrelease123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=asisrelease123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Run Unit Tests & Build Signed Release APK
        run: |
          gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --no-daemon
          gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/ASiS-pannel-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ASiS-pannel-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASiS-pannel-APKs
          path: release-assets/*.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ASiS pannel v1.0.${{ github.run_number }} (Release APK)"
          body: |
            ### دانلود مستقیم فایل نصبی ASiS pannel
            - **`ASiS-pannel-release.apk`**: نسخهٔ نهایی و امضاشده (Release) آمادهٔ نصب روی اندروید.
            - **`ASiS-pannel-debug.apk`**: نسخهٔ Debug.
          files: |
            release-assets/ASiS-pannel-release.apk
            release-assets/ASiS-pannel-debug.apk
          draft: false
          prerelease: false
