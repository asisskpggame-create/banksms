name: CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release APK (JDK 21 / SDK 35 / AGP 8.7.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK 35
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Adapt Gradle Configuration for AGP 8.7.3 & compileSdk 35
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          # 1. Update gradle/libs.versions.toml to public Maven versions compatible with AGP 8.7.3 & compileSdk 35
          toml_path = Path("gradle/libs.versions.toml")
          toml = toml_path.read_text(encoding="utf-8")
          replacements = {
              'agp = "9.1.1"': 'agp = "8.7.3"',
              'coreKtx = "1.18.0"': 'coreKtx = "1.15.0"',
              'junitVersion = "1.3.0"': 'junitVersion = "1.2.1"',
              'espressoCore = "3.7.0"': 'espressoCore = "3.6.1"',
              'activityCompose = "1.10.1"': 'activityCompose = "1.9.3"',
              'kotlin = "2.2.10"': 'kotlin = "2.0.21"',
              'googleDevtoolsKsp = "2.3.5"': 'googleDevtoolsKsp = "2.0.21-1.0.28"',
              'navigationCompose = "2.8.9"': 'navigationCompose = "2.8.5"',
              'roomRuntime = "2.7.0"': 'roomRuntime = "2.6.1"',
              'roomKtx = "2.7.0"': 'roomKtx = "2.6.1"',
              'roomCompiler = "2.7.0"': 'roomCompiler = "2.6.1"',
              'kotlinxCoroutinesTest = "1.10.2"': 'kotlinxCoroutinesTest = "1.9.0"',
              'kotlinxCoroutinesAndroid = "1.10.2"': 'kotlinxCoroutinesAndroid = "1.9.0"',
              'kotlinxCoroutinesCore = "1.10.2"': 'kotlinxCoroutinesCore = "1.9.0"',
              'robolectric = "4.16.1"': 'robolectric = "4.14.1"',
              'googleServices = "4.5.0"': 'googleServices = "4.4.2"',
          }
          for old, new in replacements.items():
              toml = toml.replace(old, new)
          if "kotlin-android =" not in toml:
              toml = toml.replace(
                  "[plugins]\n",
                  '[plugins]\nkotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }\n'
              )
          toml_path.write_text(toml, encoding="utf-8")

          # 2. Update root build.gradle.kts
          root_bg = Path("build.gradle.kts")
          rtext = root_bg.read_text(encoding="utf-8")
          if "libs.plugins.kotlin.android" not in rtext:
              rtext = rtext.replace(
                  "alias(libs.plugins.android.application) apply false",
                  "alias(libs.plugins.android.application) apply false\n  alias(libs.plugins.kotlin.android) apply false"
              )
          rtext = rtext.replace("alias(libs.plugins.google.services) apply false", "// alias(libs.plugins.google.services) apply false")
          root_bg.write_text(rtext, encoding="utf-8")

          # 3. Update app/build.gradle.kts for AGP 8.7.3 & compileSdk 35
          app_bg = Path("app/build.gradle.kts")
          atext = app_bg.read_text(encoding="utf-8")
          atext = atext.replace(
              "import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy",
              "// import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy"
          )
          if "libs.plugins.kotlin.android" not in atext:
              atext = atext.replace(
                  "alias(libs.plugins.android.application)",
                  "alias(libs.plugins.android.application)\n  alias(libs.plugins.kotlin.android)"
              )
          atext = atext.replace("alias(libs.plugins.google.services)", "// alias(libs.plugins.google.services)")
          atext = re.sub(r"compileSdk\s*\{[^}]*\}\s*\}", "compileSdk = 35", atext)
          atext = atext.replace("targetSdk = 36", "targetSdk = 35")
          atext = atext.replace(
              "targetCompatibility = JavaVersion.VERSION_11\n  }",
              'targetCompatibility = JavaVersion.VERSION_11\n  }\n  kotlinOptions {\n    jvmTarget = "11"\n  }'
          )
          atext = atext.replace(
              "googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN }",
              "// googleServices omitted in CI"
          )
          app_bg.write_text(atext, encoding="utf-8")
          EOF

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Signing Keystore (Secrets or Auto-Generated Fallback)
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          REL_KS="${{ runner.temp }}/release-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64_SECRET" ] && [ -n "$STORE_PASS_SECRET" ] && [ -n "$KEY_PASS_SECRET" ]; then
            echo "Using repository release signing secrets."
            echo "$KEYSTORE_BASE64_SECRET" | base64 -d > "$REL_KS"
            echo "KEYSTORE_PATH=$REL_KS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS_SECRET" >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets found; generating ephemeral release keystore so APK release succeeds."
            FALLBACK_PASS="asis_release_2026"
            keytool -genkeypair -v -keystore "$REL_KS" \
              -storepass "$FALLBACK_PASS" -alias upload -keypass "$FALLBACK_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ASiS Panel,O=ASiS,C=IR"
            echo "KEYSTORE_PATH=$REL_KS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble & Verify Signed Release APK
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.1.0"
          fi
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/ASiS-pannel-${TAG_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/ASiS-pannel-${TAG_NAME}-debug.apk"

      - name: Clean Temporary Keystore Files
        if: always()
        run: rm -f "${{ runner.temp }}/release-upload-key.jks" debug.keystore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASiS-pannel-apks
          path: release-assets/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "ASiS pannel ${{ env.RELEASE_TAG }}"
          body_path: RELEASE_NOTES.md
          files: release-assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
